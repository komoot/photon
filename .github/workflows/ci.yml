name: CI

on:
  push:
  pull_request:

jobs:
  build:

    name: Compile project and run tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java:
          - 21
          - 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # 5.2.0
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'gradle'

      - name: Compile project, run tests
        run: ./gradlew build --no-daemon

      - name: Rename jar with version and git SHA
        if: matrix.java == 21
        run: |
          VERSION=$(./gradlew -q properties --property version | grep '^version:' | awk '{print $2}')
          SHA=$(git rev-parse --short HEAD)
          mv target/photon-*.jar target/photon-$VERSION-$SHA.jar

      - name: Upload photon jar artifact
        if: matrix.java == 21
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: target/photon-*.jar
          archive: false
          if-no-files-found: error

  import:
    name: Import OSM data from Nominatim into Photon
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # 5.2.0
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Compile project
        run: ./gradlew assemble --no-daemon

      - name: Get Photon version
        run: echo "PHOTON_VERSION=$(./gradlew -q properties --property version | grep '^version:' | awk '{print $2}')" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: osm-search/Nominatim
          path: Nominatim

      - name: Get Date
        run: echo "cache_key=$(/bin/date -u "+%Y%W")" >> "$GITHUB_ENV"
        shell: bash

      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # 5.0.3
        with:
            path: |
               Nominatim/data/country_osm_grid.sql.gz
               monaco-latest.osm.pbf
            key: nominatim-test-data-${{ env.cache_key }}

      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osm2pgsql postgresql-postgis virtualenv pkg-config libicu-dev
        shell: bash

      - name: Setup database
        run: |
            echo 'fsync = off' | sudo tee /etc/postgresql/16/main/conf.d/local.conf
            echo 'synchronous_commit = off' | sudo tee -a /etc/postgresql/16/main/conf.d/local.conf
            echo 'full_page_writes = off' | sudo tee -a /etc/postgresql/16/main/conf.d/local.conf
            echo 'shared_buffers = 512MB' | sudo tee -a /etc/postgresql/16/main/conf.d/local.conf
            sudo systemctl start postgresql
            sudo -u postgres createuser -S www-data
            sudo -u postgres createuser -s runner
            psql -d postgres -c "ALTER USER runner PASSWORD 'foobar'"
            psql --version
            psql -d postgres -c "SELECT version()"
        shell: bash

      - name: Download dependencies
        run: |
            if [ ! -f Nominatim/data/country_osm_grid.sql.gz ]; then
                wget --no-verbose -O Nominatim/data/country_osm_grid.sql.gz https://www.nominatim.org/data/country_grid.sql.gz # supply-chain:ignore (verified via sha256 checksum)
                echo "09d85801a625079b7007fda0f2fb880db62dcea09f17f8e12e5c1b485e60794e  Nominatim/data/country_osm_grid.sql.gz" | sha256sum -c -
            fi
        shell: bash

      - name: Build Nominatim
        run: |
            virtualenv ~/venv
            ~/venv/bin/pip install packaging/nominatim-db
        shell: bash
        working-directory: Nominatim

      - name: Prepare import environment
        run: |
            if [ ! -f monaco-latest.osm.pbf ]; then
                wget --no-verbose https://download.geofabrik.de/europe/monaco-latest.osm.pbf.md5 # supply-chain:ignore (checksum file)
                wget --no-verbose https://download.geofabrik.de/europe/monaco-latest.osm.pbf # supply-chain:ignore (verified via publisher checksum)
                md5sum -c monaco-latest.osm.pbf.md5
                rm -f monaco-latest.osm.pbf.md5
            fi
            mkdir data-env
        shell: bash

      - name: Import Nominatim
        run: |
          ~/venv/bin/nominatim import --osm-file ../monaco-latest.osm.pbf --reverse-only
          ~/venv/bin/nominatim admin --check-database
        shell: bash
        working-directory: data-env

      - name: Import Photon
        run: |
          java -jar "target/photon-$PHOTON_VERSION.jar" import -database nominatim -user runner -password foobar
          java -jar "target/photon-$PHOTON_VERSION.jar" update-init -import-user runner -database nominatim -user runner -password foobar

      - name: Update Nominatim
        run: |
          ~/venv/bin/pip install osmium
          ~/venv/bin/nominatim replication --init
          ~/venv/bin/nominatim replication --once
        shell: bash
        working-directory: data-env
        env:
          NOMINATIM_REPLICATION_MAX_DIFF: 10

      - name: Update Photon
        run: java -jar "target/photon-$PHOTON_VERSION.jar" update -database nominatim -user runner -password foobar


  backwards-compatibility:
    name: Check backwards compatibility against Photon 1.0.1
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # 5.2.0
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq expect
        shell: bash

      - name: Compile Photon with older OpenSearch version
        run: ./gradlew assemble -PosVersion=3.5.0.0

      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # 5.0.3
        with:
            path: |
               andorra.jsonl.zst
               photon-1.0.1.jar
            key: old-photon-download

      - name: Download json dump and baseline Photon
        run: |
            if [ ! -f andorra.jsonl.zst ]; then
              wget --no-verbose -O andorra.jsonl.zst.md5 https://download1.graphhopper.com/public/europe/andorra/photon-dump-andorra-1.0-latest.jsonl.zst.md5 # supply-chain:ignore (checksum file)
              wget --no-verbose -O andorra.jsonl.zst https://download1.graphhopper.com/public/europe/andorra/photon-dump-andorra-1.0-latest.jsonl.zst # supply-chain:ignore (verified via publisher checksum)
              echo "$(awk '{print $1}' andorra.jsonl.zst.md5)  andorra.jsonl.zst" | md5sum -c -
              rm -f andorra.jsonl.zst.md5
            fi
            if [ ! -f photon-1.0.1.jar ]; then
              wget --no-verbose -O photon-1.0.1.jar https://github.com/komoot/photon/releases/download/1.0.1/photon-1.0.1.jar # supply-chain:ignore (verified via sha256 checksum)
              echo "4ef937f7f33fb89fef403f825edae14299240a0115df756f8fad67b3dc266437  photon-1.0.1.jar" | sha256sum -c -
            fi
        shell: bash

      - name: Get Photon version
        run: echo "PHOTON_VERSION=$(./gradlew -q properties --property version | grep '^version:' | awk '{print $2}')" >> "$GITHUB_ENV"

      - name: Import json dump
        run: zstdcat andorra.jsonl.zst | java -jar "target/photon-$PHOTON_VERSION.jar" import -import-file -
        shell: bash

      - name: Run serve with baseline version
        run: expect -c "spawn java -jar photon-1.0.1.jar serve; expect \"You are running Javalin\" { close } eof {exit 2} timeout {exit 2}"
        shell: bash

      - name: Compile Photon with current OpenSearch version
        run: ./gradlew assemble

      - name: Run serve with master version
        run: expect -c "spawn java -jar target/photon-$PHOTON_VERSION.jar serve; expect \"You are running Javalin\" { close } eof {exit 2} timeout {exit 2}"
        shell: bash
