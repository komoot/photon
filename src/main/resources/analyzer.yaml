normalization:
  input:
    - ":: NFKC"
    - ":: lower"
    - ":: Hans-Hant"
    - "ß > 'ss'"
    - "[’‘׳`\\'] > 'ʼ'"
    - "[[:Punctuation:][:Symbol:] - [ʼ]]+  > ' '"
